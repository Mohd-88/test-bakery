<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test Bakery - Order a cake</title>

  <!-- PathGuide: replace this line with the script tag from PathGuide > Install -->
  <script src="https://pathguideuae.com/widget.js" data-org="org-8gntl8peez"></script>

  <style>
    body { font-family: Arial, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { margin-bottom: 4px; }
    p.lead { color: #666; margin-top: 0; }
    label { display: block; margin-top: 16px; font-weight: bold; }
    input, select, textarea { width: 100%; padding: 10px; margin-top: 6px; font-size: 16px; box-sizing: border-box; }
    .row { display: flex; gap: 8px; align-items: center; margin-top: 16px; }
    .row input { width: auto; margin: 0; }
    button { margin-top: 24px; padding: 12px 24px; font-size: 16px; background: #b5476b; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Test Bakery</h1>
  <p class="lead">Order a custom cake for pickup.</p>

  <form id="order-form" action="thanks.html" method="get">
    <label for="cake_type">Cake type</label>
    <select id="cake_type" name="cake_type" required>
      <option value="">Choose a cake</option>
      <option>Chocolate</option>
      <option>Vanilla</option>
      <option>Red velvet</option>
    </select>

    <label for="cake_size">Size</label>
    <select id="cake_size" name="cake_size" required>
      <option value="">Choose a size</option>
      <option>Small (6 people)</option>
      <option>Medium (12 people)</option>
      <option>Large (20 people)</option>
    </select>

    <label for="message_on_cake">Message on the cake</label>
    <input id="message_on_cake" name="message_on_cake" placeholder="Happy birthday">

    <label for="pickup_date">Pickup date</label>
    <input id="pickup_date" name="pickup_date" type="date" required>

    <label for="customer_name">Your name</label>
    <input id="customer_name" name="customer_name" required>

    <label for="customer_phone">Phone</label>
    <input id="customer_phone" name="customer_phone" type="tel" required>

    <div class="row">
      <input id="agree_terms" name="agree_terms" type="checkbox" required>
      <label for="agree_terms" style="margin:0;font-weight:normal">I agree to pay on pickup</label>
    </div>

    <button id="place-order" type="submit">Place order</button>
  </form>
</body>
</html>
